<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>1017 small mint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #05050a; touch-action: none;
  }
  canvas { display: block; }
  
  /* 底部提示文字，点击后消失 */
  .message {
    position: fixed; bottom: 15%; width: 100%; text-align: center;
    color: #a2ccff; font-size: 20px; font-family: 'Microsoft YaHei', sans-serif;
    letter-spacing: 4px; text-shadow: 0 0 15px #4a90d9; pointer-events: none;
    animation: breathe 3s ease-in-out infinite; transition: opacity 0.5s;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
</style>
</head>
<body>

<canvas id="heartCanvas"></canvas>
<div class="message" id="msg">点击屏幕，收下这颗心</div>

<!-- 音乐标签，请确保 letter.mp3 和这个网页在同一个文件夹 -->
<audio id="bgMusic" loop>
  <source src="letter.mp3" type="audio/mpeg">
</audio>

<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  const audio = document.getElementById('bgMusic');
  const msg = document.getElementById('msg');
  let W, H;

  // 屏幕自适应
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 突破浏览器限制，点击后播放音乐并隐藏文字
  const startExperience = () => {
    audio.play().catch(e => console.log("等待用户交互播放:", e));
    msg.style.opacity = 0;
    document.body.removeEventListener('click', startExperience);
    document.body.removeEventListener('touchstart', startExperience);
  };
  document.body.addEventListener('click', startExperience);
  document.body.addEventListener('touchstart', startExperience);

  // 粒子类（复刻 Python 逻辑）
  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.t = Math.random() * Math.PI * 2;
      this.isInner = Math.random() > 0.35;
      this.offset = this.isInner ? Math.random() * 0.85 : 0.85 + Math.random() * 0.25;
      this.baseSize = this.isInner ? Math.random() * 1.5 + 1.5 : Math.random() * 3.0 + 3.0;
      this.phase = Math.random() * Math.PI * 2;
      this.trail = [];
    }
    draw(timeVal) {
      const timeSec = timeVal / 1000;
      
      // 爱心公式
      const xBase = 16 * Math.pow(Math.sin(this.t), 3);
      const yBase = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));
      
      // 缩放与跳动
      const scale = (Math.min(W, H) / 800) * 13;
      const pulse = 1 + Math.sin(timeSec * 3) * 0.06;
      
      // 噪声
      const noiseX = Math.sin(timeSec * 2 + this.phase) * 5;
      const noiseY = Math.cos(timeSec * 2 + this.phase) * 5;
      
      const x = W / 2 + (xBase * this.offset * scale * pulse) + noiseX;
      const y = H / 2 + (yBase * this.offset * scale * pulse) + noiseY;

      // 拖尾效果
      this.trail.push({x, y});
      if (this.trail.length > 4) this.trail.shift();
      
      this.trail.forEach((pt, i) => {
        const ratio = i / this.trail.length;
        const r = this.baseSize * ratio;
        if (r > 0.5) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          // 用透明度模拟拖尾
          ctx.fillStyle = this.isInner 
            ? `rgba(50, 150, 255, ${ratio * 0.4})` 
            : `rgba(120, 230, 255, ${ratio * 0.6})`;
          ctx.fill();
        }
      });

      // 主体粒子
      const alpha = 0.6 + Math.sin(timeSec * 4 + this.phase) * 0.4;
      const r = this.baseSize * alpha;
      
      if (r > 0) {
        // 核心提亮计算
        const cr = Math.min(255, Math.floor((this.isInner ? 50 : 120) * alpha * 1.5));
        const cg = Math.min(255, Math.floor((this.isInner ? 150 : 230) * alpha * 1.5));
        const cb = Math.min(255, Math.floor((this.isInner ? 255 : 255) * alpha * 1.5));
        
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
        ctx.shadowColor = '#4a90d9';
        ctx.shadowBlur = this.isInner ? 5 : 15; // 发光特效
        ctx.fill();
      }
    }
  }

  // 初始化 2000 个粒子
  const particles = [];
  for (let i = 0; i < 2000; i++) {
    particles.push(new Particle());
  }

  // 动画循环
  function animate(timeVal) {
    // 用深色半透明覆盖，形成残影，颜色更融合
    ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
    ctx.fillRect(0, 0, W, H);
    
    // 开启网页端的加色发光模式（堪比 BLEND_RGBA_ADD）
    ctx.globalCompositeOperation = 'lighter';

    particles.forEach(p => p.draw(timeVal));

    requestAnimationFrame(animate);
  }
  
  // 启动
  requestAnimationFrame(animate);
</script>
</body>
</html>
