<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>1017 small mint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background-color: #000 !important; touch-action: none;
  }
  canvas#heartCanvas { display: block; background-color: #000; }

  /* 固定在左下角的小兔子 */
  .music-btn {
    position: fixed; bottom: 30px; left: 30px;
    width: 65px; height: 65px;
    /* 这次默认让它显示出来！ */
    display: flex; 
    justify-content: center; align-items: center;
    cursor: pointer; z-index: 100;
    animation: floatBunny 2s ease-in-out infinite alternate;
  }

  @keyframes floatBunny {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }

  /* 兔子耳朵动画 */
  .bunny-ear {
    transform-origin: bottom center;
    animation: wiggle 1.5s ease-in-out infinite alternate;
  }
  .bunny-ear.right {
    animation-delay: 0.2s;
  }

  @keyframes wiggle {
    0% { transform: rotate(-8deg); }
    100% { transform: rotate(8deg); }
  }
  
  /* 播放时兔子周围的光圈 */
  .music-btn.playing {
    filter: drop-shadow(0 0 15px rgba(120, 230, 255, 0.8));
  }
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<!-- 可爱的小兔子 -->
<div class="music-btn" id="musicBtn" title="点击播放音乐">
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 粉色左耳 -->
    <g class="bunny-ear left">
      <ellipse cx="35" cy="30" rx="8" ry="22" fill="#fff" stroke="#a2ccff" stroke-width="2"/>
      <ellipse cx="35" cy="30" rx="4" ry="15" fill="#ffb8d0" />
    </g>
    <!-- 粉色右耳 -->
    <g class="bunny-ear right">
      <ellipse cx="65" cy="30" rx="8" ry="22" fill="#fff" stroke="#a2ccff" stroke-width="2"/>
      <ellipse cx="65" cy="30" rx="4" ry="15" fill="#ffb8d0" />
    </g>
    <!-- 兔脸 -->
    <ellipse cx="50" cy="65" rx="28" ry="24" fill="#fff" stroke="#a2ccff" stroke-width="2"/>
    <!-- 红脸蛋 -->
    <ellipse cx="32" cy="72" rx="5" ry="3" fill="#ffb8d0" opacity="0.8"/>
    <ellipse cx="68" cy="72" rx="5" ry="3" fill="#ffb8d0" opacity="0.8"/>
    <!-- 眼睛 -->
    <circle cx="38" cy="60" r="3" fill="#333"/>
    <circle cx="62" cy="60" r="3" fill="#333"/>
    <!-- 鼻子 -->
    <path d="M 47 68 L 53 68 L 50 72 Z" fill="#ff8fab"/>
    <!-- 嘴巴 -->
    <path d="M 50 72 Q 45 78 42 75" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 50 72 Q 55 78 58 75" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>

<audio id="bgMusic" loop>
  <source src="letter.mp3" type="audio/mpeg">
</audio>

<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let W, H;

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  // 核心播放逻辑
  let isPlaying = false;
  const playMusic = () => {
    // 如果已经在播放，就不重复执行了
    if (isPlaying) return; 
    
    audio.play().then(() => {
      isPlaying = true;
      // 播放成功，给小兔子加个发光特效，但保留小兔子
      musicBtn.classList.add('playing'); 
    }).catch(e => {
      // 播放失败（被拦截），什么都不做，等用户点
      console.log("播放被拦截", e);
    });
  };

  // 1. 点屏幕任何地方尝试播放
  document.body.addEventListener('click', playMusic);
  document.body.addEventListener('touchstart', playMusic);

  // 2. 点小兔子强制播放（阻止事件冒泡）
  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    playMusic();
    // 点兔子时，如果实在拦截严重，稍微延迟后再试一次
    setTimeout(() => { if(!isPlaying) audio.play(); }, 100);
  });

  // 页面加载完立刻试一次
  window.addEventListener('load', () => {
    // 部分安卓机允许无交互静音播放，部分不允许
    audio.volume = 0.6; // 默认音量稍微小一点
    playMusic();
  });

  // --- 爱心动画逻辑 ---
  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.t = Math.random() * Math.PI * 2;
      this.isInner = Math.random() > 0.35;
      this.offset = this.isInner ? Math.random() * 0.85 : 0.85 + Math.random() * 0.25;
      this.baseSize = this.isInner ? Math.random() * 1.5 + 1.5 : Math.random() * 3.0 + 3.0;
      this.phase = Math.random() * Math.PI * 2;
      this.trail = [];
    }
    draw(timeVal) {
      const timeSec = timeVal / 1000;
      const xBase = 16 * Math.pow(Math.sin(this.t), 3);
      const yBase = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));
      const scale = (Math.min(W, H) / 800) * 13;
      const pulse = 1 + Math.sin(timeSec * 3) * 0.06;
      const noiseX = Math.sin(timeSec * 2 + this.phase) * 5;
      const noiseY = Math.cos(timeSec * 2 + this.phase) * 5;
      const x = W / 2 + (xBase * this.offset * scale * pulse) + noiseX;
      const y = H / 2 + (yBase * this.offset * scale * pulse) + noiseY;

      this.trail.push({x, y});
      if (this.trail.length > 4) this.trail.shift();
      
      this.trail.forEach((pt, i) => {
        const ratio = i / this.trail.length;
        const r = this.baseSize * ratio;
        if (r > 0.5) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          ctx.fillStyle = this.isInner ? `rgba(50, 150, 255, ${ratio * 0.4})` : `rgba(120, 230, 255, ${ratio * 0.6})`;
          ctx.fill();
        }
      });

      const alpha = 0.6 + Math.sin(timeSec * 4 + this.phase) * 0.4;
      const r = this.baseSize * alpha;
      if (r > 0) {
        const cr = Math.min(255, Math.floor((this.isInner ? 50 : 120) * alpha * 1.5));
        const cg = Math.min(255, Math.floor((this.isInner ? 150 : 230) * alpha * 1.5));
        const cb = 255;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
        ctx.fill();
      }
    }
  }

  const particles = [];
  for (let i = 0; i < 1500; i++) particles.push(new Particle());

  function animate(timeVal) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, W, H);
    particles.forEach(p => p.draw(timeVal));
    requestAnimationFrame(animate);
  }
  
  requestAnimationFrame(animate);
</script>
</body>
</html>
